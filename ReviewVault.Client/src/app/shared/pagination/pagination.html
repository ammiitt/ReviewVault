<nav *ngIf="totalPages > 1">
    <ul class="pagination justify-content-center mb-0">
        <!-- Previous -->
        <li class="page-item" [ngClass]="{'disabled': currentPage === 1}">
            <a class="page-link" (click)="goToPage(currentPage - 1)">
                <i class="bi bi-chevron-left"></i>
            </a>
        </li>

        <!-- First page -->
        <li class="page-item" *ngIf="currentPage > 3"
            [ngClass]="{'active': currentPage === 1}">
            <a class="page-link" (click)="goToPage(1)">1</a>
        </li>

        <!-- Dots before -->
        <li class="page-item disabled" *ngIf="currentPage > 4">
            <span class="page-link">...</span>
        </li>

        <!-- Page numbers -->
        <li class="page-item" *ngFor="let page of getVisiblePages()"
            [ngClass]="{'active': page === currentPage}">
            <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
        </li>

        <!-- Dots after -->
        <li class="page-item disabled" *ngIf="currentPage < totalPages - 3">
            <span class="page-link">...</span>
        </li>

        <!-- Last page -->
        <li class="page-item" *ngIf="currentPage < totalPages - 2"
            [ngClass]="{'active': currentPage === totalPages}">
            <a class="page-link" (click)="goToPage(totalPages)">{{ totalPages }}</a>
        </li>

        <!-- Next -->
        <li class="page-item" [ngClass]="{'disabled': currentPage === totalPages}">
            <a class="page-link" (click)="goToPage(currentPage + 1)">
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>

    <!-- Page info -->
    <div class="text-center mt-2">
        <small class="text-body-secondary">
            Page {{ currentPage }} of {{ totalPages }} · {{ totalCount }} posts
        </small>
    </div>
</nav>
