<!-- Hero Section with background image -->
<div class="hero-section mb-5 mt-2">
    <div class="hero-overlay">
        <div class="hero-content text-center text-white">
            <h1 class="display-4 fw-bold mb-3">
                <i class="bi bi-film me-2"></i>ReviewVault
            </h1>
            <p class="lead mb-4 mx-auto" style="max-width: 600px">
                Your go-to destination for movie, anime & series reviews.
                Honest takes, no spoilers.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a class="btn btn-primary btn-lg" href="#latest">
                 <i class="bi bi-fire me-2"></i>Explore Posts
                </a>
                <a class="btn btn-outline-light btn-lg" routerLink="/login">
                    <i class="bi bi-pencil-square me-2"></i>Write a Review
                </a>
            </div>
        </div>
    </div>
</div>
<!-- Loading spinner -->
<div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-body-secondary mt-2">Loading posts...</p>
</div>

<!-- Error message -->
<div *ngIf="error" class="alert alert-danger text-center">
    <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
</div>

<!-- No posts -->
<div *ngIf="!loading && !error && posts.length === 0" class="text-center py-5">
    <i class="bi bi-journal-x display-1 text-body-secondary"></i>
    <p class="text-body-secondary mt-3">No posts yet. Check back soon!</p>
</div>

<!-- Posts Grid -->
<div *ngIf="!loading && posts.length > 0">
    <h4 class="fw-bold mb-3" id="latest">
        <i class="bi bi-fire text-danger me-2"></i>Latest Posts
    </h4>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let post of posts">
            <app-post-card [post]="post"></app-post-card>
        </div>
    </div>

    <!-- Pagination -->
    <!-- Pagination -->
<div class="mt-5">
    <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [totalCount]="totalCount"
        (pageChange)="loadPage($event)">
    </app-pagination>
</div>
</div>
