<nav class="navbar navbar-expand-lg sticky-top border-bottom"
     [ngClass]="isDark ? 'navbar-dark bg-dark' : 'navbar-light bg-white'">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" routerLink="/">
            <i class="bi bi-film me-2"></i>ReviewVault
        </a>

        <!-- Mobile toggle button -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/" routerLinkActive="active"
                       [routerLinkActiveOptions]="{ exact: true }">
                        <i class="bi bi-house me-1"></i>Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/trending" routerLinkActive="active">
                        <i class="bi bi-fire me-1"></i>Trending
                    </a>
                </li>
            </ul>

            <!-- Right side -->
            <ul class="navbar-nav align-items-center gap-2">
                <!-- Theme toggle -->
                <li class="nav-item">
                    <app-theme-toggle></app-theme-toggle>
                </li>

                <!-- Not logged in -->
                <li class="nav-item" *ngIf="!isLoggedIn">
                    <a class="btn btn-outline-primary btn-sm" routerLink="/login">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Login
                    </a>
                </li>

                <!-- Logged in -->
                <li class="nav-item dropdown" *ngIf="isLoggedIn">
                    <a class="nav-link dropdown-toggle" role="button"
                       data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>{{ username }}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" routerLink="/admin/dashboard">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" routerLink="/admin/create-post">
                                <i class="bi bi-pencil-square me-2"></i>New Post
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                           <button class="dropdown-item text-danger" (click)="logout()">
                                <i class="bi bi-box-arrow-right me-2"></i>Logout
                            </button>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
